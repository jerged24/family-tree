name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: Lint & unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check backend tests

      - name: Black (format check)
        run: black --check backend tests

      - name: Unit & integration tests
        run: pytest            # e2e excluded by default (-m 'not e2e' in pyproject)

  e2e:
    name: Browser (e2e) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium (+ OS deps)
        run: python -m playwright install --with-deps chromium

      # d3 / d3-dag are vendored under frontend/vendor/, so the frontend needs
      # no network at runtime.
      - name: Playwright e2e tests
        run: pytest -m e2e
